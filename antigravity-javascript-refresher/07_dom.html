<!DOCTYPE html>
<html>
<head><title>DOM Playground</title></head>
<body>
  <button id="changeColorBtn">Change Background</button>
  <p id="message">This paragraph will update itself in 2 seconds.</p>

  <script>
    const button = document.getElementById("changeColorBtn");
    button.addEventListener("click", () => {
      const color = prompt("What color do you want to change the background to?");
      document.body.style.backgroundColor = color;
    });
 
    const message = document.getElementById("message");
    setTimeout(() => {
      message.textContent = "This paragraph updated itself after 2 seconds!";
    }, 2000);
  </script>
  </body>
</html>
